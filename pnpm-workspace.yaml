# Install scripts run only for packages listed here.
allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true

# Our own scopes skip pnpm's new-release quarantine. Scope glob, not a version
# pin: pnpm rewrites version entries on every bump and breaks --frozen-lockfile.
minimumReleaseAgeExclude:
  - '@hanzo/*'
  - '@hanzogui/*'

# @vaadin/vaadin-usage-statistics phones home. It arrives transitively via
# @arcgis/core -> @vaadin/grid -> @vaadin/component-base, so it cannot simply be
# removed from package.json; this replaces it with an empty package.
overrides:
  '@vaadin/vaadin-usage-statistics': npm:empty-npm-package@1.0.0
