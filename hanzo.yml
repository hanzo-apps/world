# Canonical CI/CD config for hanzoai/world — read by both the hanzoai/ci
# reusable workflow (.github/workflows/cicd.yml) and platform.hanzo.ai.
# One image (the Vite SPA served by hanzoai/static), and a main-branch rollout
# onto the existing `world` operator Service CR
# (universe: infra/k8s/operator/crs/world.yaml).
#
# No separate `test:` block: the Dockerfile IS the gate — `npm ci && npm run
# build` fails the image on any type error or build break, so nothing broken
# ships (same pattern as hanzoai/finance + hanzoai/console).

images:
  - name: world
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/world
    # Publishable Mapbox token (pk, URL-restricted to world.hanzo.ai) baked into
    # the Vite SPA at build so the Satellite/Terrain basemaps load (Dark stays
    # keyless CartoDB). Sourced from KMS (hanzo/deploy/VITE_MAPBOX_TOKEN,
    # env=prod) by hanzoai/ci — the key name IS the build-arg. Never in git.
    build_secrets:
      - VITE_MAPBOX_TOKEN
      # Publishable ingest key (hanzo/deploy/PUBLISHABLE_KEY, env=prod). Without it
      # every logged-out pageview and error is refused 401 at the door.
      - PUBLISHABLE_KEY

# NO `deploy:` BLOCK, and that is the whole point — cd.hanzo.ai owns rollout.
#
# This repo said so already, in release.yml's own header: "ROLLOUT IS NOT HERE.
# This cuts an image + a git tag. Deploying is a reviewed pin bump in
# hanzoai/universe, applied by cd.hanzo.ai — the App CR is ArgoCD-managed
# (selfHeal), so a `kubectl patch` from CI is reverted on the next poll."
# A `deploy:` block here contradicted that and lost: it failed every run needing
# a kubeconfig it could not use, and had it succeeded, selfHeal would have
# reverted it within one poll.
#
# Measured, so nobody has to take it on faith: the `world` Deployment carries
# `apps.hanzo.ai/installation-id: hanzo-cd`, its Application has
# `syncPolicy.automated.selfHeal: true`, its source is
# `charts/app` + `values/hanzo/world.yaml` in hanzoai/universe, and the running
# image is exactly the digest pinned there. Sync: Synced, Health: Healthy.
#
# So: to ship world, bump `tag:` AND `digest:` in that values file. One way to
# deploy, not two.
#
# KMS (kms.hanzo.ai, Universal Auth) still supplies the GHCR push token and the
# build_secrets at run time. Only KMS_CLIENT_ID/KMS_CLIENT_SECRET live as CI
# secrets; everything else is fetched here.
kms:
  path: /deploy
  environment: prod
