# Canonical CI/CD config for world — read by both the hanzoai/ci reusable
# workflow (.hanzo/workflows/cicd.yml) and platform.hanzo.ai.
# One image (the Vite SPA served by hanzoai/static), and a main-branch rollout
# onto the existing `world` operator Service CR
# (universe: infra/k8s/operator/crs/world.yaml).
#
# The Dockerfile gates the code: `npm ci && npm run build` fails the image on
# any type error or build break, so nothing broken ships (same pattern as
# hanzoai/finance + hanzoai/console). Prose is the one thing that build never
# compiles, so it gets the `test:` gate below.

images:
  - name: world
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/world
    # Publishable Mapbox token (pk, URL-restricted to world.hanzo.ai) baked into
    # the Vite SPA at build so the Satellite/Terrain basemaps load (Dark stays
    # keyless CartoDB). Sourced from KMS (hanzo/deploy/VITE_MAPBOX_TOKEN,
    # env=prod) by hanzoai/ci — the key name IS the build-arg. Never in git.
    build_secrets:
      - VITE_MAPBOX_TOKEN
    # VITE_SENTRY_DSN and VITE_ANALYTICS_WEBSITE_ID were declared here and read
    # by nothing — no source file names either. VITE_GTM_ID is read, by
    # src/bootstrap/analytics.ts, but the Dockerfile declares no ARG for it, so
    # a sealed value still could not reach the bundle. None of the three is in
    # KMS, and the build correctly refuses to bake an empty credential:
    #   ::error::build_secret VITE_SENTRY_DSN is not readable at
    #   https://api.hanzo.ai (hanzo/deploy env=prod)
    # Wiring GTM takes an ARG in the Dockerfile and a sealed value, both.

# KMS (kms.hanzo.ai, Universal Auth) supplies the GHCR push token and the
# target kubeconfig at run time. Only KMS_CLIENT_ID/KMS_CLIENT_SECRET live in
# GitHub; everything else is fetched here.
kms:
  path: /deploy
  environment: prod

# Markdown, the one source the image build never reads. `.markdownlint-cli2.jsonc`
# pins the three rules the repo agreed to (MD012/MD022/MD032) and `lint:md` is the
# script that applies them; `npm ci` takes the version from the lockfile, so the
# pin lives in one place. This gate is declared here rather than in a second
# workflow file because the shared lane is the one lane, and a gate it does not
# read is a gate that does not run.
test:
  - name: markdown
    run: |
      set -e
      npm ci
      npm run lint:md
