name: Sync to git.hanzo.ai
# DIRECTION (measured 2026-07-25, do not copy the previous claim): hanzoai/world on
# git.hanzo.ai is a PULL MIRROR (is_mirror=true) fetching github.com/hanzoai/world. So
# TODAY **GitHub is upstream and git.hanzo.ai is downstream** — the opposite of what this
# header used to assert. The giveaway is in this file's own next paragraph: mirror-sync
# tells Gitea to PULL, which only makes sense if GitHub is the source.
#
# This matters beyond labeling: a pull mirror force-updates its refs from upstream on every
# fetch, so anything committed directly on git.hanzo.ai is DISCARDED on the next sync. Do
# not treat the mirror as writable, and do not propagate a "native on git.hanzo.ai" comment
# into other repos — it was nearly copied into 200+ of them.
#
# What IS true: CI/CD runs on git.hanzo.ai — arcd executes .hanzo/workflows/ on the Hanzo
# git-runner. The intended end state (git.hanzo.ai canonical) requires converting this repo
# pull-mirror -> native and flipping the write path; that is an ops migration, not a config
# edit, and it has not happened yet.
#
# So this nudge is a LATENCY fix, not a canonicality one: it asks Gitea to pull now instead
# of waiting out the ~10-minute mirror interval, so arcd sees the new commit sooner.
#
# IDEMPOTENT: mirror-sync just tells Gitea to pull HEAD, so N nudges == 1 (same latest
# state); concurrency coalesces a burst of pushes to a single in-flight sync. FAST: no
# checkout, one bounded curl, hard timeouts. FAIL-SOFT: a missing token or hiccup never
# fails the push (the App webhook still mirrors). Set HANZO_GIT_TOKEN to enable the nudge.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the newest push's sync needs to run — cancel any older in-flight one (it would
# pull a now-stale HEAD). This is what makes rapid pushes idempotent + cheap.
concurrency:
  group: sync-git-hanzo-ai
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Nudge git.hanzo.ai to pull HEAD (mirror-sync)
        continue-on-error: true
        env:
          HANZO_GIT_TOKEN: ${{ secrets.HANZO_GIT_TOKEN }}
        run: |
          set -u
          if [ -z "${HANZO_GIT_TOKEN:-}" ]; then
            echo "HANZO_GIT_TOKEN not set — relying on the mirror App webhook. Skipping nudge."
            exit 0
          fi
          if curl -fsS --max-time 20 --retry 2 --retry-delay 2 -X POST \
               -H "Authorization: token ${HANZO_GIT_TOKEN}" \
               "https://git.hanzo.ai/api/v1/repos/hanzoai/world/mirror-sync"; then
            echo "git.hanzo.ai mirror-sync triggered"
          else
            echo "mirror-sync nudge failed (non-fatal) — the App webhook still mirrors"
          fi
