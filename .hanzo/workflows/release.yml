name: Release
# THE build+publish pipeline for ghcr.io/hanzoai/world — the one image the operator
# CR (universe: infra/k8s/operator/crs/world.yaml) pins. Runs on the git.hanzo.ai
# runner pool; ghcr auth via the hanzoai org secret GH_PAT (user hanzo-dev).
#
# THE INVARIANT, measured against the live registry and the live CR (2026-07-25):
#     a git tag v<X.Y.Z>  ⇔  an image ghcr.io/hanzoai/world:<X.Y.Z>   (NO v on the image)
# Every published image tag is bare — 2.4.42 … 2.4.51 — and the CR pins `tag: 2.4.51`.
# A `v`-prefixed image would be a tag nobody pins.
#
# WHY THIS IS THE ONLY BUILDER. `.github/workflows/cicd.yml` (hanzoai/ci reusable,
# driven by hanzo.yml) cut every image up to 2.4.51 and was neutralized to a no-op
# on 2026-07-24 — before anything native had ever run, because hanzoai/world is a
# Gitea PULL MIRROR whose Actions were disabled. Result: 2.4.51 was the last image
# and three commits shipped nothing. Actions are now enabled on the mirror; this
# file is the replacement, and it is the only thing that builds world.
#
# ROLLOUT IS NOT HERE. This cuts an image + a git tag. Deploying is a reviewed pin
# bump in hanzoai/universe, applied by cd.hanzo.ai — the App CR is ArgoCD-managed
# (selfHeal), so a `kubectl patch` from CI is reverted on the next poll.
on:
  push:
    branches: [main]
    # Workflow/doc-only edits must NOT cut a release. Real code changes on main still
    # trigger; use workflow_dispatch to force.
    paths-ignore:
      - '.github/**'
      - '.hanzo/workflows/**'
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
  packages: write
  id-token: write
concurrency:
  group: release-world
  cancel-in-progress: false
jobs:
  build-amd64:
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - name: Checkout (full history + tags — version floor read from tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Compute next version (monotonic patch bump over the 2.4.x deploy line)
        id: ver
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          # The deployed lineage is 2.4.x: the newest-by-date tags on main are v2.4.48,
          # v2.4.47, ... (HEAD is "release: v2.4.48") and every recent release commit is
          # on it. Stray tags exist off that line — notably v2.9.32 (a July-9 relic,
          # numerically largest but OLDER than the active 2.4 stream) and the 2.5.x
          # cluster. `sort -V` is purely numeric, so an UNCONSTRAINED scan lets the
          # v2.9.32 orphan hijack the floor and cut a v2.9.33 the deploy stream can't
          # follow. Pin the scan to the 2.4. line so the bump stays monotonic over the
          # ACTUAL deploy stream, not the numerically-largest orphan tag.
          LINE='2.4.'
          git_max="$(git tag -l "v${LINE}[0-9]*" \
            | sed 's/^v//' | grep -E "^${LINE//./\\.}[0-9]+$" | sort -V | tail -1 || true)"
          # Fold in ALREADY-PUSHED container tags on the same line, so a number that has
          # an image (even from a run that died before git-tagging) is never reused.
          # Best-effort — never fails the run if the API is down. Use curl (universally
          # present) NOT gh. Fold BOTH v-prefixed and legacy non-v 2.9.x image tags.
          cont_max=""
          if [ -n "${GH_PAT:-}" ]; then
            _pkgjson="$(curl -fsSL -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github+json" \
              'https://api.github.com/orgs/hanzoai/packages/container/world/versions?per_page=100' 2>/dev/null || true)"
            cont_max="$(printf '%s' "$_pkgjson" \
              | { jq -r '.[].metadata.container.tags[]?' 2>/dev/null || grep -oE '"v?[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"'; } \
              | sed 's/^v//' | grep -E "^${LINE//./\\.}[0-9]+$" | sort -V | tail -1 || true)"
          fi
          max="$(printf '%s\n%s\n%s\n' "${LINE}0" "$git_max" "$cont_max" \
            | grep -E "^${LINE//./\\.}[0-9]+$" | sort -V | tail -1)"
          major="${max%%.*}"; rest="${max#*.}"; minor="${rest%%.*}"; patch="${rest##*.}"
          version="${major}.${minor}.$((patch + 1))"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "::error::computed v${version} already exists — aborting to avoid collision"; exit 1
          fi
          # Two spellings of ONE value: the git tag carries the v, the image does not.
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "version_v=v${version}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${version} (git_max='${git_max:-none}' container_max='${cont_max:-none}')"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host
      - name: Log in to ghcr.io (GH_PAT, write:packages)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: hanzo-dev
          password: ${{ secrets.GH_PAT }}
      - name: Build + push ghcr.io/hanzoai/world
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/hanzoai/world:${{ steps.ver.outputs.version }}
          provenance: false
          # hanzo.yml declares four build_secrets, but VITE_MAPBOX_TOKEN is the only
          # one the Dockerfile actually takes as an ARG (the other three are dead
          # config: Sentry/Umami were replaced by @hanzo/event, and VITE_GTM_ID has
          # no ARG). Carried here so the capability survives the port. Unset today —
          # the live 2.4.51 bundle contains no pk.* token either, so an empty value
          # is faithful, not a regression; set the repo secret to start baking it.
          # APP_VERSION: the number THIS run just computed, handed to the Vite build so
          # the bundle self-reports the tag it ships under. Without it __APP_VERSION__
          # falls back to package.json, which no release ever writes — main says 2.4.59
          # while this job cut 2.4.60 — and that value keys the chunk-reload guard, so a
          # frozen key means browsers keep serving stale chunks across a deploy.
          build-args: |
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
            APP_VERSION=${{ steps.ver.outputs.version }}
      - name: Verify the pushed image is pullable (guard the image ⇔ tag invariant)
        # build-push-action can exit 0 while the manifest isn't yet resolvable at the
        # registry. Prove the image resolves BEFORE creating the git tag, so a bad push
        # fails the run instead of leaving a phantom tag → ImagePullBackOff.
        run: |
          set -euo pipefail
          t="${{ steps.ver.outputs.version }}"
          for i in 1 2 3 4 5 6; do
            if docker manifest inspect "ghcr.io/hanzoai/world:${t}" >/dev/null 2>&1; then
              echo "image ${t} is resolvable — safe to tag"; exit 0
            fi
            echo "ghcr manifest ${t} not visible yet (attempt ${i}/6) — retrying"; sleep 5
          done
          echo "::error::image ${t} not pullable after push — refusing to tag git (prevents ImagePullBackOff)"; exit 1
      - name: Tag the release on GitHub (image ⇔ tag invariant)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        # The tag goes UPSTREAM, not to `origin`. hanzoai/world on git.hanzo.ai is a
        # pull mirror: it force-updates its refs from GitHub on every fetch and
        # rejects pushes, so `git push origin` here can only fail (and would fail
        # AFTER the image is already published, breaking the invariant this job
        # exists to hold). GitHub is upstream; the mirror pulls the tag back.
        run: |
          set -euo pipefail
          git tag "${{ steps.ver.outputs.version_v }}"
          git push "https://x-access-token:${GH_PAT}@github.com/hanzoai/world.git" \
            "refs/tags/${{ steps.ver.outputs.version_v }}"
          echo "Pushed image ${{ steps.ver.outputs.version }} + tag ${{ steps.ver.outputs.version_v }} — bump the operator CR (universe: crs/world.yaml) to deploy."
